<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c2532" />
    <script>
      try {
        const savedTheme = localStorage.getItem('undeschimb-theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#081d24' : '#0c2532')
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://undeschimb.onrender.com/" />
    <link rel="alternate" hreflang="ro" href="https://undeschimb.onrender.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Compară cursurile EUR, USD, GBP și CHF de la băncile mari din România cu reperul BNR. Vezi cât primești și diferența pentru suma ta." />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="UndeSchimb" />
    <meta property="og:type" content="website" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "UndeSchimb",
            "url": "https://undeschimb.onrender.com/",
            "inLanguage": "ro-RO"
          },
          {
            "@type": "WebApplication",
            "name": "UndeSchimb",
            "url": "https://undeschimb.onrender.com/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "inLanguage": "ro-RO",
            "description": "Comparator de cursuri valutare standard pentru conturi personale la bănci din România, raportate la cursul de referință BNR.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "RON" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Cursul BNR poate fi folosit pentru a face schimbul valutar?",
                "acceptedAnswer": { "@type": "Answer", "text": "Nu. Cursul BNR este un reper informativ, nu o ofertă de schimb pentru persoane fizice. Banca sau furnizorul ales stabilește cursul efectiv aplicat." }
              },
              {
                "@type": "Question",
                "name": "Ce cursuri sunt incluse în comparație?",
                "acceptedAnswer": { "@type": "Answer", "text": "Sunt comparate cursurile standard pentru schimburi între conturi personale. Nu includem cursuri de casierie, card, promoționale, negociate sau destinate companiilor." }
              },
              {
                "@type": "Question",
                "name": "De ce oferta XTB este marcată ca indicativă?",
                "acceptedAnswer": { "@type": "Answer", "text": "XTB folosește cotații Standard care se pot modifica mai repede decât verificarea noastră. Calculul include comisionul de conversie publicat, însă prețul executabil din platformă poate diferi." }
              },
              {
                "@type": "Question",
                "name": "Cât de des sunt actualizate datele?",
                "acceptedAnswer": { "@type": "Answer", "text": "Colectorul verifică sursele la fiecare 15 minute cât timp serviciul este activ. Verifică mereu marcajul de timp și avertizarea de date expirate înainte de a lua o decizie." }
              }
            ]
          }
        ]
      }
    </script>
    <title>UndeSchimb — Compară cursurile valutare la bănci</title>
