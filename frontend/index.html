<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c2532" />
    <script>
      try {
        const savedTheme = localStorage.getItem('undeschimb-theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#081d24' : '#0c2532')
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://undeschimb.onrender.com/" />
    <link rel="alternate" hreflang="ro" href="https://undeschimb.onrender.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Compară cursul valutar la bănci, brokeri și case de schimb pentru EUR, USD, GBP și CHF. Vezi costul conversiei înainte să investești." />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="UndeSchimb" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="UndeSchimb — Curs valutar pentru schimb și investiții" />
    <meta property="og:description" content="Compară suma netă primită la bănci, brokeri și case de schimb înainte să schimbi bani sau să alimentezi un cont de investiții." />
    <meta property="og:url" content="https://undeschimb.onrender.com/" />
    <meta property="og:image" content="https://undeschimb.onrender.com/undeschimb-social-preview.png" />
    <meta property="og:image:alt" content="Ilustrație UndeSchimb despre compararea cursurilor valutare" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UndeSchimb — Curs valutar pentru schimb și investiții" />
    <meta name="twitter:description" content="Compară suma netă primită la bănci, brokeri și case de schimb înainte să schimbi bani sau să alimentezi un cont de investiții." />
    <meta name="twitter:image" content="https://undeschimb.onrender.com/undeschimb-social-preview.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "UndeSchimb",
            "url": "https://undeschimb.onrender.com/",
            "inLanguage": "ro-RO"
          },
          {
            "@type": "WebApplication",
            "name": "UndeSchimb",
            "url": "https://undeschimb.onrender.com/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "inLanguage": "ro-RO",
            "description": "Comparator de cursuri valutare pentru conturi personale la bănci, brokeri și case de schimb din România, raportate la cursul de referință BNR.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "RON" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Cursul BNR poate fi folosit pentru a face schimbul valutar?",
                "acceptedAnswer": { "@type": "Answer", "text": "Nu. Cursul BNR este un reper informativ, nu o ofertă de schimb pentru persoane fizice. Banca sau furnizorul ales stabilește cursul efectiv aplicat." }
              },
              {
                "@type": "Question",
                "name": "Ce cursuri sunt incluse în comparație?",
                "acceptedAnswer": { "@type": "Answer", "text": "Sunt comparate cursurile standard pentru schimburi între conturi personale. Nu includem cursuri de casierie, card, promoționale, negociate sau destinate companiilor." }
              },
              {
                "@type": "Question",
                "name": "De ce oferta XTB este marcată ca indicativă?",
                "acceptedAnswer": { "@type": "Answer", "text": "XTB folosește cotații Standard care se pot modifica mai repede decât verificarea noastră. Calculul include comisionul de conversie publicat, însă prețul executabil din platformă poate diferi." }
              },
              {
                "@type": "Question",
                "name": "Cum aleg cel mai bun curs valutar când vreau să încep să investesc?",
                "acceptedAnswer": { "@type": "Answer", "text": "Compară suma netă care ajunge în moneda contului de investiții, nu doar cursul afișat. Verifică diferența față de BNR, spreadul, comisionul de conversie și dacă oferta este disponibilă pentru suma și momentul ales." }
              },
              {
                "@type": "Question",
                "name": "Cât de des sunt actualizate datele?",
                "acceptedAnswer": { "@type": "Answer", "text": "Colectorul verifică sursele la fiecare 15 minute cât timp serviciul este activ. Verifică mereu marcajul de timp și avertizarea de date expirate înainte de a lua o decizie." }
              }
            ]
          }
        ]
      }
    </script>
    <title>UndeSchimb — Curs valutar pentru schimb și investiții</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
