services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: undeschimb
      POSTGRES_USER: undeschimb
      POSTGRES_PASSWORD: undeschimb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undeschimb -d undeschimb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://undeschimb:undeschimb@db:5432/undeschimb?sslmode=disable
      PORT: "8080"
      CORS_ORIGIN: http://localhost:5173
      MIGRATIONS_PATH: /app/migrations/001_init.sql
      XTB_HOLIDAYS: ${XTB_HOLIDAYS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080/api/v1
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
